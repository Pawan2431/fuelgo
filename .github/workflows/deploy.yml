name: Deploy FuelGo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── Job 1: Deploy Frontend to Vercel ─────────────────────────────
  deploy-web:
    name: Deploy Web App → Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuelgo-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fuelgo-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          VITE_FUELGO_CONTACT_NUMBER: ${{ secrets.VITE_FUELGO_CONTACT_NUMBER }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: fuelgo-frontend
          vercel-args: '--prod'

  # ─── Job 2: Build Android APK ─────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuelgo-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fuelgo-frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          VITE_FUELGO_CONTACT_NUMBER: ${{ secrets.VITE_FUELGO_CONTACT_NUMBER }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FuelGo-Debug-APK
          path: fuelgo-frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ─── Job 3: Deploy Backend to Railway ─────────────────────────────
  deploy-backend:
    name: Deploy Backend → Railway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: |
          cd fuelgo-backend
          railway up --service fuelgo-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
